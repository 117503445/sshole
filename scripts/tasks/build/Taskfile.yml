version: 3

tasks:
  build:
    deps: [":base:clear", ":gen:gen"]
    sources:
      - ./cmd/**
      - ./internal/**
      - ./pkg/**
      - ./.git/**
      - ./go.mod
      - ./go.sum
      - ./Taskfile.yml
      - ./scripts/script/**
    generates:
      - ./data/agent/sshole_agent
      - ./data/entry/sshole_entry
      - ./data/hub/sshole_hub
    cmds:
      - cd ./scripts/script && go run . build

  build-docker:
    deps: [":base:clear", ":build:build"]
    sources:
      - ./scripts/docker/agent.Dockerfile
      - ./data/agent/sshole_agent
      - ./scripts/docker/hub.Dockerfile
      - ./data/hub/sshole_hub
      - ./scripts/docker/entry.Dockerfile
      - ./data/entry/sshole_entry
    cmds:
      - docker build -t 117503445/sshole-agent -f ./scripts/docker/agent.Dockerfile .
      - docker build -t 117503445/sshole-hub -f ./scripts/docker/hub.Dockerfile .
      - docker build -t 117503445/sshole-entry -f ./scripts/docker/entry.Dockerfile .
