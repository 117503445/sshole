syntax = "proto3";

package pkg.rpc.v1;

option go_package = "sshole/pkg/rpc/v1;rpcv1";

message AcquireConnectionRequest {
  string id = 1;
}

message AcquireConnectionResponse {
  string message = 1;
  string auth = 2;
  
  int32 port = 3;
  string ssh_public_key = 4;
  string ssh_private_key = 5;
}

service HoleService {
  rpc AcquireConnection(AcquireConnectionRequest) returns (AcquireConnectionResponse) {}
}