syntax = "proto3";

package pkg.rpc.v1;

option go_package = "github.com/117503445/sshole/pkg/rpc/v1;rpcv1";

// ListAgentsRequest 请求所有 agent 的固定映射信息。
message ListAgentsRequest {}

// AgentInfo 描述一个 agent 的公开信息。
message AgentInfo {
  string agent_name = 1;
  int32 hub_port = 2;
  bool online = 3;
}

// ListAgentsResponse 返回 agent 列表。
message ListAgentsResponse {
  repeated AgentInfo agents = 1;
}

// AppendKnownHostRequest 将公钥行写入指定 agent 的 known_hosts。
message AppendKnownHostRequest {
  string agent_name = 1;
  string public_key = 2;
}

message AppendKnownHostResponse {}

service HoleService {
  // ListAgents 返回所有已配置 agent 的映射与在线状态。
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);

  // AppendKnownHost 让 Hub 通知 Agent 将提供的公钥行追加到 known_hosts。
  rpc AppendKnownHost(AppendKnownHostRequest) returns (AppendKnownHostResponse);
}
