# SSH 内网穿透系统配置文件

# Hub 配置
hub:
  address: ":8080"
  read_timeout: 30s
  write_timeout: 30s

# Agent 配置
agent:
  hub_address: "ws://localhost:8080"
  reconnect_interval: 5s
  heartbeat_interval: 30s

# Entry 配置
entry:
  hub_address: "ws://localhost:8080"
  local_address: ":10022"
  reconnect_interval: 5s
  heartbeat_interval: 30s

# 认证配置
auth:
  token: ""
  enabled: false

# 日志配置
log:
  level: "info"
  format: "json"
  file: ""
