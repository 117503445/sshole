# 运行 go-task 命令 而不是 task 命令
# go-task build

version: "3"

dotenv: [".env"]

includes:
  base:
    taskfile: ./scripts/tasks/base
  build:
    taskfile: ./scripts/tasks/build
  gen:
    taskfile: ./scripts/tasks/gen
  format:
    taskfile: ./scripts/tasks/format

tasks:
  default:
    desc: "The default task"
    deps: ["base:clear"]
    cmds:
      - task: base:dev