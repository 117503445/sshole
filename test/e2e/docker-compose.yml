version: '3.8'

services:
  # Hub 服务
  hub:
    build:
      context: ../../
      dockerfile: test/e2e/Dockerfile
    container_name: sshole-hub-test
    ports:
      - "8080:8080"
    environment:
      - COMPONENT_TYPE=hub
    command: ["./e2e-test", "--component=hub"]
    networks:
      - sshole-test
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Agent 服务
  agent:
    build:
      context: ../../
      dockerfile: test/e2e/Dockerfile
    container_name: sshole-agent-test
    depends_on:
      hub:
        condition: service_healthy
    environment:
      - COMPONENT_TYPE=agent
      - HUB_ADDRESS=ws://hub:8080
      - AGENT_TOKEN=test-token
      - AGENT_ID=test-agent-01
    command: ["./e2e-test", "--component=agent"]
    networks:
      - sshole-test

  # Entry 服务
  entry:
    build:
      context: ../../
      dockerfile: test/e2e/Dockerfile
    container_name: sshole-entry-test
    depends_on:
      hub:
        condition: service_healthy
    ports:
      - "10022:10022"
    environment:
      - COMPONENT_TYPE=entry
      - HUB_ADDRESS=ws://hub:8080
      - ENTRY_TOKEN=test-token
      - CONNECTION_ID=test-connection-01
      - LOCAL_ADDR=:10022
    command: ["./e2e-test", "--component=entry"]
    networks:
      - sshole-test

  # 测试运行器
  test-runner:
    build:
      context: ../../
      dockerfile: test/e2e/Dockerfile
    container_name: sshole-test-runner
    depends_on:
      - hub
      - agent
      - entry
    environment:
      - COMPONENT_TYPE=test-runner
      - HUB_ADDRESS=ws://hub:8080
      - SSH_HOST=entry
      - SSH_PORT=10022
    command: ["./e2e-test", "--component=test-runner"]
    networks:
      - sshole-test
    volumes:
      - test-results:/app/test-results

networks:
  sshole-test:
    driver: bridge

volumes:
  test-results:
